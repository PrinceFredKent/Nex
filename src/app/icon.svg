<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4458"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff2a3b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Nex Geometric Icon ("N" with Play Accent) -->
  <g filter="url(#glow)">
    <!-- Left vertical bar of N -->
    <path d="M16 46V18C16 16.8954 16.8954 16 18 16H21C22.1046 16 23 16.8954 23 18V46C23 47.1046 22.1046 48 21 48H18C16.8954 48 16 47.1046 16 46Z" fill="url(#redGrad)"/>

    <!-- Diagonal crossbar of N -->
    <path d="M20 17.5L42.5 45.5C43.1 46.2 44.2 46 44.5 45.1L45 44V18C45 16.8954 44.1046 16 43 16H40C38.8954 16 38 16.8954 38 18V36.5L24 18.5C23.2 17.5 21.8 17 20 17.5Z" fill="url(#redGrad)"/>

    <!-- Right vertical bar of N -->
    <path d="M41 46V18C41 16.8954 41.8954 16 43 16H46C47.1046 16 48 16.8954 48 18V46C48 47.1046 47.1046 48 46 48H43C41.8954 48 41 47.1046 41 46Z" fill="url(#redGrad)"/>

    <!-- Play arrow glowing dot in the center -->
    <polygon points="31,28 39,32 31,36" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
